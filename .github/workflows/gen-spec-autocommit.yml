# Auto-regenerate Cargo.build-spec.json on every Cargo.toml / Cargo.lock
# change. Pairs with substrate's `useCommittedSpecIfFresh` freshness
# gate: as long as this workflow auto-commits the regenerated spec on
# every PR + push, substrate consumers see the **Fresh** verdict and
# skip IFD entirely — near-instant evaluation, cache-friendly across
# hosts.
#
# The workflow IS the forcing function. Operators never run
# `gen build .` manually; CI does. Drift becomes impossible by
# construction.

name: gen-spec-autocommit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gen-spec-autocommit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cargo.toml"
      - "Cargo.lock"

# One job per branch — serialize commits so two PRs landing back-to-back
# don't race-condition on the same Cargo.build-spec.json.
concurrency:
  group: gen-spec-autocommit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regen-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real commit identity to push back to the branch on
          # main (PRs use the fork's checkout and we open a PR-back
          # rather than commit-back).
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so we can rebase/commit cleanly.
          fetch-depth: 0

      - name: Cache cargo registry + git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update stable
          rustup default stable

      - name: Build gen-cli
        run: cargo build --release -p gen-cli

      - name: Regenerate Cargo.build-spec.json
        run: ./target/release/gen build .

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- Cargo.build-spec.json; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push regenerated spec (main only)
        if: steps.drift.outputs.drifted == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "gen-spec-bot"
          git config user.email "gen-spec-bot@pleme-io.invalid"
          git add Cargo.build-spec.json
          git commit -m "gen: regen Cargo.build-spec.json (auto, ${{ github.sha }})"
          git push origin main

      - name: Fail PR if spec drifted (PR only)
        if: steps.drift.outputs.drifted == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::Cargo.build-spec.json is stale relative to Cargo.{toml,lock}."
          echo "::error::Run \`gen build .\` locally and include the regenerated spec in this PR."
          echo "::error::Drift diff:"
          git --no-pager diff -- Cargo.build-spec.json | head -200
          exit 1
