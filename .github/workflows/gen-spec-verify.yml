# Verify the committed build input is current, and keep it that way.
#
# THE TRACKED ARTIFACT IS `Cargo.gen.lock`, NOT `Cargo.build-spec.json`.
# Gen is on the delta-only doctrine: `gen build --commit`
# (gen-cli/src/main.rs:commit_spec_if_drifted) deliberately RETIRES the
# full spec — `git rm --cached` + ensure-gitignored — and stages the slim
# `Cargo.gen.lock`, from which substrate reconstructs the full spec in
# pure Nix (substrate/lib/build/rust/lockfile-delta.nix). gen's own
# flake.nix consumes that delta path, so the full spec is a local build
# product here, not a committed input.
#
# This header previously claimed the opposite ("gen legitimately commits
# Cargo.build-spec.json"), and the drift gate below diffed that
# gitignored path accordingly. `git diff` over an untracked file reports
# nothing and exits 0, so the gate could not fail: verified 2026-07-27 by
# replacing the spec with literal garbage and watching the gate report
# GREEN. It was a Tier-⊥ vacuous guard (UNREPRESENTABILITY §II.3 subclass
# A — a check over an empty subject set). Both the claim and the gate
# named the wrong artifact; both now name `Cargo.gen.lock`.
#
# Two complementary gates, and the ORDER is load-bearing:
#   1. `gen confirm .` runs BEFORE any regeneration, so it judges what
#      the author actually committed. Run after `gen build` it would read
#      the freshly-written delta and pass unconditionally — the same
#      vacuity in a new place. Strict mode (no --if-present) is required:
#      a missing delta is a distinct failing arm (DeltaFreshness::
#      MissingDelta), so "no subject" FAILS rather than passing as
#      "no diff".
#   2. `git diff --exit-code -- Cargo.gen.lock` runs AFTER regeneration
#      and catches drift that leaves Cargo.lock's hash untouched — e.g. a
#      `[features]` edit in a Cargo.toml, which changes the delta but not
#      the lock, and which gate 1 alone would call Fresh.
#
# Behavior:
#   - On pull request: confirm the committed delta, regenerate, fail the
#     PR if regeneration changed it.
#   - On push to main: regenerate + atomically commit via gen's --commit
#     (gen-spec-bot identity), push back via the typed
#     git-push-with-token action.

name: gen-spec-verify

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      # The gate's own subject: a commit touching only the delta (a hand
      # edit, a bad merge resolution) must not slip past unexamined.
      - "Cargo.gen.lock"
      - ".github/workflows/gen-spec-verify.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cargo.gen.lock"
      - ".github/workflows/gen-spec-verify.yml"

concurrency:
  group: gen-spec-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - name: Build gen-cli
        run: cargo build --release -p gen-cli

      # GATE 1 — judge the COMMITTED tree, before anything regenerates it.
      # Strict (no --if-present): a missing Cargo.gen.lock fails here
      # rather than being tolerated, so this cannot go green by examining
      # nothing. Must stay ahead of the regen step below.
      - name: Confirm the committed delta is fresh (PR)
        if: github.event_name == 'pull_request'
        run: ./target/release/gen confirm .

      # On main: regen + atomically commit if drifted (gen-spec-bot
      # identity is baked into the --commit flag). On PR: regen
      # without committing so the next step can detect drift and
      # fail the PR with a clear diff.
      - name: Regen + commit (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./target/release/gen build . --commit

      - name: Regen (PR — no commit)
        if: github.event_name == 'pull_request'
        run: ./target/release/gen build .

      - name: Sanity-check spec content
        run: ./target/release/gen check-spec

      # GATE 2 — drift the lock-hash tie cannot see (a Cargo.toml
      # `[features]` edit changes the delta but not Cargo.lock). Diffs
      # `Cargo.gen.lock`, which IS tracked, so the subject set is real and
      # `--exit-code` fails on any difference while printing it.
      # paths-dirty rather than `git diff --exit-code`, and the difference is
      # real here: the regen step above can CREATE Cargo.gen.lock where none was
      # tracked, and git diff cannot see an untracked file — so the old form
      # passed for exactly the case a first-time regen produces.
      - name: Fail PR if author didn't include the regen
        if: github.event_name == 'pull_request'
        uses: pleme-io/actions/paths-dirty@main
        with:
          paths: Cargo.gen.lock
          expect: clean
          reason: |
            Cargo.gen.lock is stale. Run `gen build . --commit` locally and
            include the regen commit in this PR.

      # Push the gen-spec-bot commit back to main via the typed
      # action — no inline shell URL rewriting.
      - uses: pleme-io/actions/git-push-with-token@main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          push-tags: "false"
