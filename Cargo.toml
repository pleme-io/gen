[workspace]
resolver = "3"
members = [
    "crates/gen-types",
    "crates/gen-macros",
    "crates/gen-solve",
    "crates/gen-platform",
    "crates/gen-cargo",
    "crates/gen-helm",
    "crates/gen-pip",
    "crates/gen-gomod",
    "crates/gen-ansible",
    "crates/gen-poetry",
    "crates/gen-swift",
    "crates/gen-npm",
    "crates/gen-bundler",
    "crates/gen-adapter-forge",
    "crates/gen-polyglot",
    "crates/gen-config",
    "crates/gen-nix",
    "crates/gen-nix-bulk",
    "crates/gen-bazel",
    "crates/gen-buck",
    "crates/gen-cache-attic",
    "crates/gen-caixa-bridge",
    "crates/gen-pdc",
    "crates/gen-secattest",
    "crates/gen-verdict",
    "crates/gen-cli",
]

[workspace.package]
version = "0.1.32"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
homepage = "https://github.com/pleme-io/gen"
repository = "https://github.com/pleme-io/gen"
authors = ["pleme-io"]

[workspace.dependencies]
# Workspace crates
gen-types = { path = "crates/gen-types", version = "0.1.32" }
gen-solve = { path = "crates/gen-solve", version = "0.1.32" }
gen-pdc = { path = "crates/gen-pdc", version = "0.1.32" }
gen-secattest = { path = "crates/gen-secattest", version = "0.1.32" }
gen-verdict = { path = "crates/gen-verdict", version = "0.1.32" }
gen-platform = { path = "crates/gen-platform", version = "0.1.32" }
gen-cargo = { path = "crates/gen-cargo", version = "0.1.32" }
gen-npm = { path = "crates/gen-npm", version = "0.1.32" }
gen-bundler = { path = "crates/gen-bundler", version = "0.1.32" }
gen-adapter-forge = { path = "crates/gen-adapter-forge", version = "0.1.32" }
gen-polyglot = { path = "crates/gen-polyglot", version = "0.1.32" }
gen-config = { path = "crates/gen-config", version = "0.1.32" }
gen-nix = { path = "crates/gen-nix", version = "0.1.32" }
gen-nix-bulk = { path = "crates/gen-nix-bulk", version = "0.1.32" }
gen-bazel = { path = "crates/gen-bazel", version = "0.1.32" }
gen-buck = { path = "crates/gen-buck", version = "0.1.32" }
gen-caixa-bridge = { path = "crates/gen-caixa-bridge", version = "0.1.32" }
gen-cache-attic = { path = "crates/gen-cache-attic", version = "0.1.32" }
gen-cli = { path = "crates/gen-cli", version = "0.1.32" }

# Third-party
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inventory = "0.3"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
shikumi = { version = "0.1", git = "https://github.com/pleme-io/shikumi.git", rev = "3913d35559a65bc64a870f5633cc3130371b412e" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

# ★ GEN SELF-REFERENCE PATCH — gen depends on shikumi/shigoto (git),
# which in turn depend on gen-types/gen-macros/gen-platform via the
# gen git URL. Without this patch cargo resolves those three from
# git+https://github.com/pleme-io/gen instead of the local workspace
# members, so gen-cargo sees is_path_dep=false → omits lib_target →
# the workspace-member-missing-lib-target invariant trips and gen
# cannot emit a clean v10 build-spec FOR ITSELF (the one repo the
# delta migration could not reach). Redirecting the git URL to the
# path members closes the transitive self-reference. See
# [[project_gen_delta_migration]].
[patch."https://github.com/pleme-io/gen"]
gen-types = { path = "crates/gen-types" }
gen-macros = { path = "crates/gen-macros" }
gen-platform = { path = "crates/gen-platform" }
