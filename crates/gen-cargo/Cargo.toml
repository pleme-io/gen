[package]
name = "gen-cargo"
description = "gen — Cargo adapter. Parses Cargo.toml + Cargo.lock + workspace shape into gen_types::Manifest. The cargo half of the universal package-manager engine; one of N adapters (gen-npm, gen-bundler, gen-pip, gen-gomod, gen-helm, …) that share the typed core. See theory/GEN.md for the full design."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "gen_cargo"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
gen-types = { workspace = true }
gen-macros = { version = "0.1.0", path = "../gen-macros" }
gen-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"
rayon = "1.10"
cargo_metadata = { workspace = true }
inventory = { workspace = true }
# Pure-Rust NAR-sha256 (nix-nar streamed into Sha256) + SRI base64.
# Replaces the brittle nix-prefetch-git shell-script call chain. The
# git clone itself is currently a `Command::new("git")` subprocess
# pending the destination move to `gix` (full in-process git). gix
# was wired in 2026-05-29 but its transport features pull in
# *-sys crates whose link deps substrate's buildRustCrate doesn't
# propagate — `ring` (rustls path, build-script env-var bug) and
# `curl-sys` / `libgit2-sys` (propagatedBuildInputs not bubbled to
# consumers). Both are substrate-side fixes deferred to a focused
# follow-up. Today's compromise: one subprocess to one binary
# (`git`), down from the previous shell-script transitive chain.
# See theory/RUST-NATIVE-PREFETCH.md for the destination.
nix-nar = "0.3"
base64 = "0.22"
tempfile = "3"

# Shigoto — typed job system. Fleet-sweep is a Dag of GenBuildJobs
# (one per repo) executed through InProcessScheduler with a
# per-kind budget cap. Replaces the previous sequential
# `for entry in entries { ... }` loop with budgeted parallelism +
# per-repo recording sinks. The canonical model is tend's
# StatusRepoJob / PullRepoJob pattern; gen.build-spec is the
# fourth kind in the fleet to land on the substrate.
shigoto-types = "0.1"
shigoto-scheduler = "0.1"
shigoto-emit = "0.1"
shigoto-budget = "0.1"
shigoto-dag = "0.1"
async-trait = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
proptest = "1"
