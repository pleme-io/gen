[package]
name = "gen-cargo"
description = "gen — Cargo adapter. Parses Cargo.toml + Cargo.lock + workspace shape into gen_types::Manifest. The cargo half of the universal package-manager engine; one of N adapters (gen-npm, gen-bundler, gen-pip, gen-gomod, gen-helm, …) that share the typed core. See theory/GEN.md for the full design."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "gen_cargo"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
gen-types = { workspace = true }
gen-macros = { path = "../gen-macros" }
gen-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"
rayon = "1.10"
cargo_metadata = { workspace = true }
inventory = { workspace = true }
# Pure-Rust git fetcher + NAR-sha256 — replaces the brittle
# nix-prefetch-git shell-script call chain. See theory/RUST-NATIVE-PREFETCH.md.
# Versions match what pleme-io/sui's sui-compat uses so the substrate
# NAR semantics stay aligned fleet-wide.
gix = { version = "0.83", default-features = false, features = ["sha1", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "revision", "max-performance-safe"] }
nix-nar = "0.3"
base64 = "0.22"
tempfile = "3"

[dev-dependencies]
proptest = "1"
