[package]
name = "gen-gomod"
description = "gen — gomod adapter. Parses go.mod + lockfile into a typed gen_types::Spec emission. One of N adapters that share the typed core via Spec/QuirkRegistry/Invariants traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "gen_gomod"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
gen-types = { workspace = true }
gen-macros = { version = "0.1.0", path = "../gen-macros" }
gen-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
inventory = { workspace = true }
# Content-address of a node's resolved sources (source_hash). BLAKE3 to
# match the estante/CA discipline used fleet-wide for content keys.
blake3 = { workspace = true }
# go_sum_sha256 freshness tie. SHA-256 specifically (not BLAKE3) because
# Nix has built-in `builtins.hashFile "sha256"` but no BLAKE3 surface —
# same rationale as gen-cargo's cargo_lock_sha256.
sha2 = "0.10"

[dev-dependencies]
indexmap = { workspace = true }
serde_json = { workspace = true }
